[project]
name = "pytest-slowtrace"
version = "0.1.0"
description = "A pytest plugin that reports what a test was doing when it ran too long"
authors = [
    { name = "Tim Hatch", email = "timhatch@netflix.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
]

[project.entry-points.pytest11]
slowtrace = "pytest_slowtrace.plugin"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-xdist>=3.6.1",
    "ty>=0.0.74",
]
