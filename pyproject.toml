[build-system]
requires = [
  "setuptools >= 77",
  "setuptools-scm >= 8",
]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-slowtrace"
description = "A pytest plugin that reports what a test was doing when it ran too long"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Tim Hatch", email = "tim@timhatch.com" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/thatch/pytest-slowtrace/"

[project.optional-dependencies]
dev = [
  "build >= 1",
  "checkdeps == 0.9.0",
  "mypy == 1.19.1",
  "ruff == 0.15.6",
]
test = [
  "coverage >= 7.14",
  "pytest >= 8",
]

[project.scripts]
# foo = "foo:bar"

[tool.setuptools]
packages = { find = {} }
include-package-data = true

[tool.setuptools.package-data]
"pytest_slowtrace" = ["py.typed"]

[tool.setuptools_scm]
version_file = "pytest_slowtrace/_version.py"

[tool.coverage.run]
branch = true
parallel = true
source = ["pytest_slowtrace", "tests"]

[tool.coverage.report]
fail_under = 70
precision = 1
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I", # isort
]

[tool.ruff.lint.isort]
order-by-type = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "PLR2004", # Magic value used instead of constant (only in tests)
]
